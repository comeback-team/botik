services:
  botik:
    build: app
    container_name: botik
    restart: unless-stopped
    # env_file:
    #   - .env
    ports:
      - "8080:8080"
  
  nginx:
    image: nginx:1.31-alpine
    container_name: botik-nginx
    restart: unless-stopped
    depends_on:
      - botik
    ports:
      - "80:80"
