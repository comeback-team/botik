[project]
name = "botik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arman-wsl", email = "matv864@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.8",
    "faster-whisper>=1.0.0",
    "pydub>=0.25.1",
    "noisereduce>=3.0.2",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "gigachat>=0.2"
]

[project.scripts]
botik = "botik:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
